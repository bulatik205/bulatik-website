<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bulatik205 | Главная</title>
    <link rel="stylesheet" href="styles/index.css">
</head>
<body>
    <header class="header" id="glassHeader">
        <div class="header--content">
            <p>
                bulatik
            </p>

            <div>
                <a href="">Блог</a>
                <a href="https://github.com/bulatik205/bulatik-website"><img src="images/GitHub_Invertocat_White.png" alt=""></a>
            </div>
        </div>
    </header>

    <div class="main--block">
        <div class="main--block--body">
            <h2 class="fs-firacode">Привет, меня зовут Булат!</h2>
            <p class="fs-firacode">Я - начинающий разработчик</p>

            <div class="main--block--body--stack">
                <p class="stack--body">PHP 8.0+</p>
                <p class="stack--body">Python</p>
                <p class="stack--body">MySQL</p>
                <p class="stack--body">LEMP</p>
                <p class="stack--body">Git/GitHub</p>
                <p class="stack--body">JS/AJAX</p>
            </div>
        </div>
    </div>

    <div style="height: 200vh;"></div>

    <script>
        const header = document.getElementById('glassHeader');
        let lastScroll = 0;

        window.addEventListener('scroll', () => {
            const currentScroll = window.pageYOffset;
            
            if (currentScroll > 1) {
                header.classList.add('visible');
            } else {
                header.classList.remove('visible');
            }
            
            lastScroll = currentScroll;
        });
    </script>
</body>
</html>
